<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maya's Lair | Maya Vyas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Montserrat:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        playfair: ["Playfair Display", "serif"],
                        montserrat: ["Montserrat", "sans-serif"]
                    }
                }
            }
        };
    </script>
</head>
<body class="relative w-full min-h-screen flex flex-col bg-black font-montserrat">

    <!-- Video Background -->
    <video autoplay loop muted playsinline class="absolute inset-0 w-full h-full object-cover" aria-hidden="true">
        <source src="../Maya_Images/evilLairVideo.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <!-- Logo / Home -->
    <a href="../index.html" class="absolute top-8 left-8 z-50 block w-24 h-16" aria-label="Back to home">
        <img src="../Maya_Images/HomeIcon.png" alt="Maya Vyas" class="w-full h-full object-contain">
    </a>

    <!-- Overlay UI: two clear entry points -->
    <div id="lair-ctas" class="relative z-10 flex-1 flex flex-col items-center justify-center px-4 pb-24 opacity-0 transition-opacity duration-700">
        <p class="text-white/90 text-center text-sm md:text-base mb-8 font-medium max-w-md">
            Explore the lair — play the arcade or chat with characters from Maya's work.
        </p>
        <div class="flex flex-col sm:flex-row gap-6">
            <a href="../Game_Launcher/gameLauncher.html"
               class="lair-cta lair-cta--arcade flex items-center justify-center gap-3 px-8 py-4 bg-white/15 backdrop-blur-sm border-2 border-orange-500 text-white rounded-xl font-semibold text-lg hover:bg-orange-500/30 hover:border-orange-400 transition focus:outline-none focus:ring-2 focus:ring-orange-400 focus:ring-offset-2 focus:ring-offset-black"
               aria-label="Open Game Launcher — play Doodle Jump and view leaderboard">
                <span aria-hidden="true">🕹️</span>
                <span>Arcade</span>
            </a>
            <a href="../Characters/characters.html"
               class="lair-cta lair-cta--characters flex items-center justify-center gap-3 px-8 py-4 bg-white/15 backdrop-blur-sm border-2 border-orange-500 text-white rounded-xl font-semibold text-lg hover:bg-orange-500/30 hover:border-orange-400 transition focus:outline-none focus:ring-2 focus:ring-orange-400 focus:ring-offset-2 focus:ring-offset-black"
               aria-label="Meet the characters — chat with Sita, Nikki, and Sean">
                <span aria-hidden="true">💬</span>
                <span>Meet the characters</span>
            </a>
        </div>
    </div>

    <footer class="relative z-20 py-3 text-center bg-black/50 text-white text-sm">
        <a href="../index.html" class="hover:underline">Home</a>
        <span class="mx-2">|</span>
        <a href="../about.html" class="hover:underline">About</a>
        <span class="mx-2">|</span>
        <a href="../projects.html" class="hover:underline">Projects</a>
        <span class="mx-2">|</span>
        <span>&copy; 2026 Maya Vyas</span>
    </footer>

    <script src="./lair.js"></script>
</body>
</html>
