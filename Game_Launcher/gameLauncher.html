<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Launcher</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Montserrat:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        .leaderboard-list { list-style: none; padding: 0; margin: 0; }
        .leaderboard-list h2 { font-family: 'Playfair Display', serif; font-size: 1.25rem; margin-bottom: 0.75rem; color: #1f2937; }
        .pinned-score { background: #fff7ed; border-left: 4px solid #ea580c; padding: 0.5rem 0.75rem; margin-bottom: 0.5rem; border-radius: 0.25rem; display: flex; justify-content: space-between; font-weight: 600; }
        .leaderboard-item { padding: 0.5rem 0.75rem; border-bottom: 1px solid #e5e7eb; display: flex; justify-content: space-between; gap: 1rem; }
        .leaderboard-item .rank { color: #6b7280; min-width: 2rem; }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        playfair: ["Playfair Display", "serif"],
                        montserrat: ["Montserrat", "sans-serif"]
                    }
                }
            }
        };
    </script>
</head>
<body class="bg-gray-100 text-gray-900 font-montserrat">

    <!-- ✅ Back Button -->
    <button id="back-button" 
            class="absolute top-4 left-4 px-4 py-2 text-lg font-semibold bg-orange-600 text-white rounded-lg shadow-md hover:bg-orange-700 transition">
        &#8592; Back
    </button>

    <!-- ✅ Centered Content -->
    <div class="flex flex-col justify-center items-center min-h-screen space-y-6">

        <!-- 🎮 Game Launcher Title -->
        <h1 class="text-4xl font-bold">Game Launcher</h1>

        <!-- 🕹️ Game Box -->
        <div class="flex flex-wrap justify-center gap-8">
            <a href="../Games/doodleJump.html" 
               class="bg-white rounded-lg shadow-lg p-6 flex flex-col items-center space-y-4 hover:scale-105 transition border-2 border-transparent hover:border-orange-500">
                <img src="../Games/Sprites/rightPlayer.png" alt="Doodle Jump Character" class="w-32 h-32" loading="lazy">
                <h2 class="text-xl font-semibold">Doodle Jump</h2>
            </a>
        </div>

        <!-- 🏆 Leaderboard Section -->
        <div id="leaderboard-container" class="w-full max-w-md bg-white shadow-md rounded-lg p-4 overflow-auto max-h-96 border border-gray-200">
            <!-- Leaderboard content loads here -->
        </div>

    </div>

    <footer class="bg-gray-100 py-6 mt-16 text-center w-full">
        <p class="text-gray-700">📧 Contact: <a href="mailto:Khart@anonymouscontent.com" class="text-blue-500 hover:underline">khart@anonymouscontent.com</a></p>
        <div class="flex justify-center space-x-6 mt-4">
            <a href="https://www.linkedin.com/in/maya-vyas/" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-linkedin text-gray-700 text-2xl hover:text-black"></i></a>
            <a href="https://twitter.com/maya_vya4" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-twitter text-gray-700 text-2xl hover:text-black"></i></a>
            <a href="https://www.instagram.com/mvyas90/" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-instagram text-gray-700 text-2xl hover:text-black"></i></a>
        </div>
        <ul class="flex justify-center space-x-6 text-gray-600 mt-4">
            <li><a href="../index.html" class="hover:text-black">Home</a></li>
            <li><a href="../about.html" class="hover:text-black">About</a></li>
            <li><a href="../projects.html" class="hover:text-black">Projects</a></li>
        </ul>
        <p class="mt-6 text-gray-500 text-sm">&copy; 2024 Maya Vyas. All Rights Reserved.</p>
    </footer>

    <script src="./leaderboard.js"></script>
    <script>
        // Back Button Functionality
        document.getElementById('back-button').addEventListener('click', (e) => {
            e.preventDefault();
            if (document.referrer) {
                window.history.back();
            } else {
                window.location.href = '../Evil_Lair/evilLair.html';
            }
        });

        // Initialize leaderboard
        window.addEventListener('load', () => {
            Leaderboard.renderLeaderboard('leaderboard-container');
        });
    </script>

</body>
</html>
