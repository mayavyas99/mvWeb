<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doodle Jump</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./doodleJumpStyles.css">
</head>
<body>
    <!-- Persistent top nav: always visible way out -->
    <nav class="game-top-nav" aria-label="Game navigation">
        <a href="../Game_Launcher/gameLauncher.html">&#8592; Game Launcher</a>
        <div class="nav-links">
            <a href="../Evil_Lair/evilLair.html">Maya's Lair</a>
            <a href="../index.html">Home</a>
        </div>
    </nav>

    <div id="game-container">
        <canvas id="canvas"></canvas>
    </div>

    <!-- High Score Modal -->
    <div id="high-score-modal" class="modal">
        <div class="modal-content">
            <h2>New High Score!</h2>
            <p>Your score: <span id="modal-score"></span></p>
            <input type="text" id="player-name" placeholder="Enter your name" maxlength="20">
            <div class="button-group">
                <button id="submit-score">Submit</button>
                <button id="skip-score">Skip</button>
            </div>
        </div>
    </div>

    <!-- Countdown Overlay -->
    <div id="countdown-overlay" class="countdown-overlay" style="display: none;"></div>

    <!-- In-page back button (redundant with top nav; kept for quick tap) -->
    <a id="back-button" class="back-button" href="../Game_Launcher/gameLauncher.html" aria-label="Back to Game Launcher">&#8592; Back</a>
    <script src="../Game_Launcher/leaderboard.js"></script>
    <script src="./src/player.js"></script>
    <script src="./src/monsters.js"></script>
    <script src="./src/block.js"></script>
    <script src="./src/powerups.js"></script>
    <script src="./src/blockType.js"></script>
    <script src="./src/blockSpawner.js"></script>
    <script src="./src/main.js"></script>
    <footer class="game-footer">
        <a href="../Game_Launcher/gameLauncher.html">&#8592; Game Launcher</a>
        <a href="../Evil_Lair/evilLair.html">Maya's Lair</a>
        <a href="../index.html">Home</a>
    </footer>
</body>
</html>
